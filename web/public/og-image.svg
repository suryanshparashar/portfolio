<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d0f" />
      <stop offset="50%" stop-color="#0f141a" />
      <stop offset="100%" stop-color="#0b0d0f" />
    </linearGradient>
    <radialGradient id="glowTeal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 120) rotate(45) scale(380 380)">
      <stop stop-color="#12f7d6" stop-opacity="0.35" />
      <stop offset="1" stop-color="#12f7d6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 80) rotate(45) scale(360 360)">
      <stop stop-color="#5b7bff" stop-opacity="0.3" />
      <stop offset="1" stop-color="#5b7bff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M 90 0 L 0 0 0 90" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    </pattern>
    <style>
      .eyebrow {
        font: 600 18px "Sora", "Inter", sans-serif;
        letter-spacing: 0.35em;
        fill: #7f8a97;
      }
      .name {
        font: 700 64px "Sora", "Inter", sans-serif;
        fill: #e6edf3;
      }
      .title {
        font: 600 36px "Sora", "Inter", sans-serif;
        fill: #12f7d6;
      }
      .tagline {
        font: 400 24px "Inter", "Sora", sans-serif;
        fill: #c8d2db;
      }
      .url {
        font: 500 22px "Inter", "Sora", sans-serif;
        fill: #7f8a97;
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3" />
  <rect width="1200" height="630" fill="url(#glowTeal)" />
  <rect width="1200" height="630" fill="url(#glowIndigo)" />

  <text x="80" y="200" class="eyebrow">PORTFOLIO</text>
  <text x="80" y="290" class="name">Suryansh Parashar</text>
  <text x="80" y="350" class="title">Full-Stack AI Engineer</text>
  <text x="80" y="420" class="tagline">I engineer full-stack applications and AI-native systems that ship and work.</text>
  <text x="80" y="500" class="url">yourname.dev</text>
</svg>
