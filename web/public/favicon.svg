<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E202B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B0C10;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="100" height="100" rx="24" fill="url(#bg-grad)" />
  
  <!-- Sleek bold 'S' -->
  <g transform="translate(42, 45) scale(1.6) translate(-50, -50)">
    <path d="M 60 34 L 45 34 A 8 8 0 0 0 45 50 L 55 50 A 8 8 0 0 1 55 66 L 40 66" 
          fill="none" 
          stroke="#F8F9FA" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Glowing Teal Accent (Underscore) -->
  <rect x="64" y="68" width="18" height="6" rx="3" fill="#00E5FF" filter="url(#glow)"/>
</svg>
