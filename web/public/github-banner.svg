<svg width="860" height="160" viewBox="0 0 860 160"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="860" y2="160"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0c0f12"/>
      <stop offset="100%" stop-color="#080a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(0 0) scale(420)">
      <stop offset="0%"   stop-color="#00e1e2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e1e2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0L0 0 0 48" fill="none"
        stroke="white" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background layers -->
  <rect width="860" height="160" rx="10" fill="url(#bg)"/>
  <rect width="860" height="160" rx="10" fill="url(#grid)"/>
  <rect width="860" height="160" rx="10" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="859" height="159" rx="9.5"
    stroke="white" stroke-opacity="0.07" fill="none"/>

  <!-- Teal dot — same as nav -->
  <circle cx="45" cy="60" r="5" fill="#00e1e2"/>

  <!-- Name -->
  <text x="60" y="68"
    font-family="'Sora','Inter',sans-serif"
    font-size="28" font-weight="800"
    letter-spacing="-0.5"
    fill="#e8e8e6">suryansh.parashar</text>

  <!-- Underscore -->
  <line x1="350" y1="68" x2="360" y2="68"
    stroke="#00e1e2" stroke-width="2"/>

  <!-- Role -->
  <text x="60" y="100"
    font-family="'Inter',sans-serif"
    font-size="15" font-weight="400"
    fill="#00e1e2" letter-spacing="0.3">Full-Stack AI Engineer</text>

  <!-- Tagline -->
  <text x="60" y="128"
    font-family="'Inter',sans-serif"
    font-size="13" font-weight="300"
    fill="#4a5563">
    Building AI-native systems end-to-end · full ownership, start to finish.
  </text>

  <!-- Right side: availability -->
  <text x="800" y="75"
    font-family="'Inter',sans-serif"
    font-size="11" font-weight="500"
    fill="#4a5563"
    text-anchor="end" letter-spacing="1">AVAILABLE FOR SELECT WORK</text>

  <text x="800" y="100"
    font-family="'Inter',sans-serif"
    font-size="22" font-weight="700"
    fill="#e8e8e6"
    text-anchor="end">2026</text>

  <!-- Separator line -->
  <line x1="535" y1="60" x2="535" y2="110"
    stroke="#00e1e2" stroke-opacity="0.25" stroke-width="1"/>
</svg>